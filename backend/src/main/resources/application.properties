# Port - Render sets PORT automatically
server.port=${PORT:8080}
server.address=0.0.0.0

# ---- DATABASE CONFIG ----
# Uses DATABASE_URL env var on Render (PostgreSQL), falls back to H2 locally
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:mediqueue}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 console (only works locally)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------- Email Setup (JavaMailSender) -------------
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=techlasi333@gmail.com
spring.mail.password=yykn hnbp twix gtza
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false

# ------------- Logging Setup -------------
logging.level.root=ERROR
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.zybots.mediqueue=INFO
spring.main.banner-mode=off
logging.pattern.console=%d{HH:mm:ss} %-5level - %msg%n

# ------------- Actuator Setup -------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always